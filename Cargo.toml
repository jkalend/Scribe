[package]
name = "kb"
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
description = "Local Markdown retrieval and cited context CLI and MCP server"

[features]
default = []
full = ["dep:reqwest", "dep:tokenizers"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "=0.40.1", features = ["bundled"] }
pulldown-cmark = { version = "=0.13.4", default-features = false }
saphyr = { version = "=0.2.2", default-features = false }
saphyr-parser = "=0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2.5"
rmcp = { version = "=3.6.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt", "time", "sync"] }
toml = "1.1"
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
tokenizers = { version = "0.23", default-features = false, features = ["onig"], optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
