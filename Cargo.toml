[package]
name = "kb"
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
description = "Local Markdown retrieval and cited context CLI over the knowledge crate"
license = "Apache-2.0"
repository = "https://github.com/jkalend/Scribe"

[features]
default = []
full = ["knowledge/full"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
knowledge = { path = "../../Components/crates/knowledge" }
rusqlite = { version = "=0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"
toml = "1.1"

[profile.release]
lto = "thin"
codegen-units = 1
