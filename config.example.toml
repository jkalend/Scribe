# Edit both paths. Absolute paths are required; no corpus or database is bundled.
# Windows paths may use forward slashes, e.g. C:/Users/you/notes.
profile = "light"

[index]
database = "/home/you/.local/share/scribe/index.sqlite"

[roots.notes]
path = "/home/you/notes"
role = "notes"
trust = "user-configured"
ignore_dirs = [".git", ".kb", "target", "__pycache__", ".venv", "venv", "node_modules", "templates"]

[limits]
max_file_bytes = 4194304
max_frontmatter_bytes = 65536
max_chunk_bytes = 8192
max_query_bytes = 4096
max_results = 100
max_context_bytes = 65536
max_response_bytes = 1048576
timeout_ms = 10000
max_files = 10000
